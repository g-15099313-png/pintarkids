<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PintarKids Launcher</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; text-align: center; padding: 20px; }
    h1 { color: #1e3a8a; }
    .card-container { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-top: 30px; }
    .student-card { background: white; border-radius: 15px; padding: 20px; width: 160px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); cursor: pointer; transition: transform 0.2s; }
    .student-card:hover { transform: scale(1.05); }
    .avatar { width: 80px; height: 80px; border-radius: 50%; background-color: #3b82f6; color: white; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: bold; margin: 0 auto 10px; }
    .pin-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; }
    .modal-content { background: white; padding: 30px; border-radius: 12px; text-align: center; }
    input[type="password"] { font-size: 24px; width: 100px; text-align: center; letter-spacing: 5px; padding: 5px; margin: 15px 0; }
    button { background-color: #22c55e; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>

  <h1>Pilih Profil Murid</h1>
  <p>Klik nama anda untuk masuk ke portal pembelajaran</p>

  <div class="card-container">
    <div class="student-card" onclick="openPinModal('Aina', '1234', 'https://classroom.google.com')">
      <div class="avatar">A</div>
      <h3>Aina</h3>
    </div>
    <div class="student-card" onclick="openPinModal('Adam', '5678', 'https://classroom.google.com')">
      <div class="avatar" style="background-color: #ef4444;">A</div>
      <h3>Adam</h3>
    </div>
  </div>

  <div id="pinModal" class="pin-modal">
    <div class="modal-content">
      <h2 id="modalTitle">Masukkan PIN</h2>
      <input type="password" id="pinInput" maxlength="4" placeholder="••••">
      <br>
      <button onclick="verifyPin()">Log Masuk</button>
      <button onclick="closeModal()" style="background-color: #6b7280;">Batal</button>
    </div>
  </div>

  <script>
    let selectedUser = {};

    function openPinModal(name, correctPin, redirectUrl) {
      selectedUser = { name, correctPin, redirectUrl };
      document.getElementById('modalTitle').innerText = 'Selamat Datang, ' + name + '!';
      document.getElementById('pinInput').value = '';
      document.getElementById('pinModal').style.display = 'flex';
      document.getElementById('pinInput').focus();
    }

    function closeModal() {
      document.getElementById('pinModal').style.display = 'none';
    }

    function verifyPin() {
      const inputPin = document.getElementById('pinInput').value;
      if (inputPin === selectedUser.correctPin) {
        window.location.href = selectedUser.redirectUrl;
      } else {
        alert('PIN salah. Sila cuba lagi!');
        document.getElementById('pinInput').value = '';
      }
    }
  </script>
</body>
</html>
